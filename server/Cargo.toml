[package]
name = "civ6-lan-server"
version = "0.1.0"
edition = "2021"
license = "MIT"
publish = false

[dependencies]
argon2 = "0.5"
axum = "0.8"
base64 = "0.22"
civ6-lan-client-core = { path = "../crates/client-core" }
civ6-lan-protocol = { path = "../crates/protocol" }
civ6-lan-router = { path = "../crates/router" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sqlx = { version = "0.8", default-features = false, features = ["macros", "migrate", "postgres", "runtime-tokio-rustls", "uuid"] }
thiserror = "2"
tokio = { version = "1", features = ["macros", "net", "process", "rt-multi-thread", "signal", "sync", "time"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "fmt"] }
uuid = "1"

[dev-dependencies]
http-body-util = "0.1"
tower = { version = "0.5", features = ["util"] }
