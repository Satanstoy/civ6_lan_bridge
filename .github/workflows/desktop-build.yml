name: desktop-build

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  rust-and-web:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - uses: dtolnay/rust-toolchain@stable
      - name: Install Linux Tauri dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libwebkit2gtk-4.1-dev \
            libappindicator3-dev \
            librsvg2-dev \
            libxdo-dev \
            libssl-dev \
            patchelf
      - name: Rust tests and lint
        run: |
          cargo test --workspace
          cargo clippy --workspace --all-targets -- -D warnings
      - name: Build Windows frontend
        working-directory: win-client
        run: npm ci && npm run build
      - name: Build macOS frontend
        working-directory: mac-client
        run: npm ci && npm run build

  windows-exe:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: win-client/package-lock.json
      - uses: dtolnay/rust-toolchain@stable
      - name: Check Windows Tauri Rust target
        working-directory: win-client
        run: cargo check --manifest-path src-tauri/Cargo.toml
      - name: Install frontend dependencies
        working-directory: win-client
        run: npm ci
      - name: Build unsigned candidate NSIS installer
        working-directory: win-client
        run: npm run tauri build -- --ci --no-sign --bundles nsis
      - name: Validate Windows installer candidate
        shell: pwsh
        run: |
          $installer = Get-ChildItem win-client/src-tauri/target/release/bundle/nsis/*.exe |
            Where-Object { $_.Name -notmatch 'uninstall' } |
            Select-Object -First 1
          if ($null -eq $installer) {
            throw "NSIS installer was not produced"
          }
          if ($installer.Length -lt 1000000) {
            throw "Windows installer is unexpectedly small: $($installer.Length) bytes"
          }
          Write-Host "Installer: $($installer.FullName) ($($installer.Length) bytes)"
      - name: Smoke-test Windows install, firewall hooks, and uninstall
        shell: pwsh
        run: |
          $installer = Get-ChildItem win-client/src-tauri/target/release/bundle/nsis/*.exe |
            Where-Object { $_.Name -notmatch 'uninstall' } |
            Select-Object -First 1
          $installRoot = Join-Path $env:RUNNER_TEMP "civ6-lan-bridge-install"
          if (Test-Path $installRoot) {
            Remove-Item -LiteralPath $installRoot -Recurse -Force
          }
          $install = Start-Process -FilePath $installer.FullName `
            -ArgumentList @('/S', "/D=$installRoot") -Wait -PassThru
          if ($install.ExitCode -ne 0) {
            throw "NSIS install failed with exit code $($install.ExitCode)"
          }
          $installedExe = Get-ChildItem -LiteralPath $installRoot -File -Filter "*.exe" |
            Where-Object { $_.Name -notmatch "^(unins|uninstall|WebView2Loader)" } |
            Select-Object -First 1
          if ($null -eq $installedExe) {
            Get-ChildItem -LiteralPath $installRoot -Recurse -Force | Format-Table -AutoSize | Out-String | Write-Host
            throw "Installed client executable was not found below $installRoot"
          }
          $rules = @(Get-NetFirewallRule -ErrorAction SilentlyContinue |
            Where-Object { $_.DisplayName -like "Civ6 LAN Bridge*" })
          if ($rules.Count -lt 2) {
            throw "Expected relay firewall rules were not installed"
          }
          $uninstaller = Get-ChildItem -LiteralPath $installRoot -File |
            Where-Object { $_.Name -match 'unins|uninstall' } |
            Select-Object -First 1
          if ($null -eq $uninstaller) {
            throw "NSIS uninstaller was not found"
          }
          $uninstall = Start-Process -FilePath $uninstaller.FullName `
            -ArgumentList @('/S') -Wait -PassThru
          if ($uninstall.ExitCode -ne 0) {
            throw "NSIS uninstall failed with exit code $($uninstall.ExitCode)"
          }
          $remainingRules = @(Get-NetFirewallRule -ErrorAction SilentlyContinue |
            Where-Object { $_.DisplayName -like "Civ6 LAN Bridge*" })
          if ($remainingRules.Count -ne 0) {
            throw "Firewall rules remained after uninstall"
          }
          Write-Host "Windows NSIS install/uninstall smoke test passed"
      - name: Upload Windows installer
        uses: actions/upload-artifact@v4
        with:
          name: civ6-lan-bridge-windows-exe
          path: win-client/src-tauri/target/release/bundle/nsis/*.exe
          if-no-files-found: error
      - name: Hash Windows installer
        shell: pwsh
        run: |
          $installer = Get-ChildItem win-client/src-tauri/target/release/bundle/nsis/*.exe |
            Where-Object { $_.Name -notmatch 'uninstall' } |
            Select-Object -First 1
          Get-FileHash $installer.FullName -Algorithm SHA256 | Format-List

  macos-dmg:
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: macos-14
            arch: arm64
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: mac-client/package-lock.json
      - uses: dtolnay/rust-toolchain@stable
      - name: Prepare loopback aliases for live UDP tests
        run: |
          sudo ifconfig lo0 alias 127.0.0.2 255.0.0.0 || true
          sudo ifconfig lo0 alias 127.0.0.3 255.0.0.0 || true
      - name: Verify shared server and relay tests on macOS toolchain
        run: cargo test --workspace
      - name: Type-check Network Extension provider
        run: |
          SDK="$(xcrun --sdk macosx --show-sdk-path)"
          swiftc -typecheck \
            -sdk "$SDK" \
            -target "${{ matrix.arch }}-apple-macos12.0" \
            -framework NetworkExtension \
            mac-client/PacketTunnel/Sources/*.swift
      - name: Run Swift packet and relay protocol smoke test
        run: |
          swiftc \
            mac-client/PacketTunnel/Sources/IPv4UDP.swift \
            mac-client/PacketTunnel/Sources/RelayEnvelope.swift \
            mac-client/PacketTunnel/Sources/Civ6PacketRouter.swift \
            mac-client/PacketTunnel/Tests/ProtocolSmoke.swift \
            -o "$RUNNER_TEMP/civ6-lan-bridge-protocol-smoke"
          "$RUNNER_TEMP/civ6-lan-bridge-protocol-smoke"
      - name: Validate macOS app icon format
        run: |
          python3 - <<'PY'
          import struct

          path = "mac-client/src-tauri/icons/icon.png"
          with open(path, "rb") as icon:
              if icon.read(8) != b"\x89PNG\r\n\x1a\n":
                  raise SystemExit("macOS app icon is not a PNG")
              length = struct.unpack(">I", icon.read(4))[0]
              chunk = icon.read(4)
              if chunk != b"IHDR" or length < 13:
                  raise SystemExit("macOS app icon has no valid IHDR")
              width, height, bit_depth, color_type = struct.unpack(">IIBB", icon.read(10))
              if (width, height) != (1024, 1024):
                  raise SystemExit(f"unexpected macOS app icon dimensions: {width}x{height}")
              if (bit_depth, color_type) != (8, 6):
                  raise SystemExit(
                      f"macOS app icon must be 8-bit RGBA, got bit_depth={bit_depth}, color_type={color_type}"
                  )
          print("macOS app icon is 1024x1024 8-bit RGBA")
          PY
      - name: Build unsigned Packet Tunnel extension target
        id: build-packet-tunnel
        continue-on-error: true
        run: |
          set -o pipefail
          xcodebuild -verbose \
            -project mac-client/PacketTunnel/PacketTunnel.xcodeproj \
            -scheme PacketTunnel \
            -configuration Release \
            -destination generic/platform=macOS \
            -derivedDataPath "mac-client/PacketTunnel/.build/${{ matrix.arch }}" \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            build 2>&1 | tee "$RUNNER_TEMP/packet-tunnel-xcodebuild.log"
      - name: Upload Packet Tunnel build log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: civ6-lan-bridge-packet-tunnel-build-log-${{ matrix.arch }}
          path: ${{ runner.temp }}/packet-tunnel-xcodebuild.log
          if-no-files-found: error
      - name: Summarize Packet Tunnel build log
        if: always()
        run: |
          {
            echo '### Packet Tunnel xcodebuild log (last 200 lines)'
            tail -200 "$RUNNER_TEMP/packet-tunnel-xcodebuild.log"
          } >> "$GITHUB_STEP_SUMMARY"
      - name: Fail if Packet Tunnel build failed
        if: steps.build-packet-tunnel.outcome == 'failure'
        run: exit 1
      - name: Upload unsigned Packet Tunnel validation artifact
        uses: actions/upload-artifact@v4
        with:
          name: civ6-lan-bridge-packet-tunnel-${{ matrix.arch }}
          path: mac-client/PacketTunnel/.build/${{ matrix.arch }}/Build/Products/Release/PacketTunnel.appex
          if-no-files-found: error
      - name: Stage Packet Tunnel for the candidate App bundle
        run: |
          mkdir -p mac-client/PacketTunnel/build
          ditto \
            "mac-client/PacketTunnel/.build/${{ matrix.arch }}/Build/Products/Release/PacketTunnel.appex" \
            mac-client/PacketTunnel/build/PacketTunnel.appex
      - name: Install frontend dependencies
        working-directory: mac-client
        run: npm ci
      - name: Build macOS DMG candidate
        working-directory: mac-client
        run: npm run tauri build -- --ci --no-sign --config src-tauri/tauri.ci.conf.json
      - name: Validate Packet Tunnel is embedded in the candidate App
        run: |
          APP_PATH="$(find mac-client/src-tauri/target/release/bundle/macos -maxdepth 1 -name '*.app' -print -quit)"
          test -n "$APP_PATH"
          test -d "$APP_PATH/Contents/PlugIns/PacketTunnel.appex"
          test -n "$(find "$APP_PATH/Contents/MacOS" -type f -perm -111 -print -quit)"
      - name: Verify and mount macOS DMG candidate
        shell: bash
        run: |
          set -Eeuo pipefail
          DMG_PATH="$(find mac-client/src-tauri/target/release/bundle/dmg -maxdepth 1 -name '*.dmg' -print -quit)"
          test -n "$DMG_PATH"
          hdiutil verify "$DMG_PATH"
          MOUNT_POINT="$(mktemp -d "$RUNNER_TEMP/civ6-lan-bridge-dmg.XXXXXX")"
          DEVICE="$(hdiutil attach "$DMG_PATH" -nobrowse -readonly -mountpoint "$MOUNT_POINT" | awk '/Apple_HFS|APFS/ { print $1; exit }')"
          cleanup() {
            if [ -n "${DEVICE:-}" ]; then
              hdiutil detach "$DEVICE" -quiet || true
            fi
            rm -rf "$MOUNT_POINT"
          }
          trap cleanup EXIT
          APP_ON_DMG="$(find "$MOUNT_POINT" -maxdepth 1 -name '*.app' -print -quit)"
          test -n "$APP_ON_DMG"
          test -d "$APP_ON_DMG/Contents/PlugIns/PacketTunnel.appex"
          test -n "$(find "$APP_ON_DMG/Contents/MacOS" -type f -perm -111 -print -quit)"
          echo "macOS DMG mounted and contains the app plus PacketTunnel.appex"
      - name: Upload macOS DMG
        uses: actions/upload-artifact@v4
        with:
          name: civ6-lan-bridge-macos-${{ matrix.arch }}-dmg
          path: mac-client/src-tauri/target/release/bundle/dmg/*.dmg
          if-no-files-found: error
      - name: Hash macOS DMG
        run: shasum -a 256 mac-client/src-tauri/target/release/bundle/dmg/*.dmg

  macos-release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [windows-exe, macos-dmg]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Download macOS DMG artifacts
        uses: actions/download-artifact@v4
        with:
          name: civ6-lan-bridge-macos-arm64-dmg
          path: release-artifacts/macos
      - name: Download Windows EXE artifacts
        uses: actions/download-artifact@v4
        with:
          name: civ6-lan-bridge-windows-exe
          path: release-artifacts/windows
      - name: Prepare versioned release assets
        shell: bash
        run: |
          set -Eeuo pipefail
          mkdir -p release
          source_dmg="$(find release-artifacts/macos -type f -name '*.dmg' -print -quit)"
          source_exe="$(find release-artifacts/windows -type f -name '*.exe' ! -name '*uninstall*' -print -quit)"
          test -n "$source_dmg"
          test -n "$source_exe"
          cp "$source_dmg" release/civ6-lan-bridge-macos-arm64.dmg
          cp "$source_exe" release/civ6-lan-bridge-windows-x64-setup.exe
          shasum -a 256 release/*.dmg release/*.exe > release/SHA256SUMS
          cat > release/RELEASE_NOTES.md <<EOF
          ## Civ6 LAN Bridge ${GITHUB_REF_NAME}

          Unsigned candidate packages built from commit ${GITHUB_SHA}.

          - Apple Silicon: \`civ6-lan-bridge-macos-arm64.dmg\`
          - Windows x64: \`civ6-lan-bridge-windows-x64-setup.exe\`
          - Checksums: \`SHA256SUMS\`

          This is a test candidate. The Packet Tunnel/Civ VI data path and real
          Civ VI room discovery still require validation on physical devices.
          EOF
      - name: Publish GitHub Release assets
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if gh release view "$GITHUB_REF_NAME" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            gh release upload "$GITHUB_REF_NAME" release/*.dmg release/*.exe release/SHA256SUMS \
              --repo "$GITHUB_REPOSITORY" --clobber
          else
            gh release create "$GITHUB_REF_NAME" release/*.dmg release/*.exe release/SHA256SUMS \
              --repo "$GITHUB_REPOSITORY" \
              --title "Civ6 LAN Bridge $GITHUB_REF_NAME" \
              --notes-file release/RELEASE_NOTES.md \
              --prerelease
          fi
