[package]
name = "civ6-lan-bridge-macos"
version = "0.1.0"
description = "Civ6 LAN Bridge macOS client"
authors = ["Civ6 LAN Bridge"]
edition = "2021"
license = "MIT"
publish = false

[workspace]

[lib]
name = "civ6_lan_bridge_macos_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
civ6-lan-client-core = { path = "../../crates/client-core" }
civ6-lan-protocol = { path = "../../crates/protocol" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tauri = { version = "2", features = [] }
