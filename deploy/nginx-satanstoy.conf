server {
    listen 80;
    listen [::]:80;
    server_name www.satanstoy.site satanstoy.site;
    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name www.satanstoy.site satanstoy.site;

    ssl_certificate /etc/nginx/ssl/satanstoy.site.crt;
    ssl_certificate_key /etc/nginx/ssl/satanstoy.site.key;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_ciphers ECDHE-RSA-AES128-GCM-SHA256:HIGH:!aNULL:!MD5:!RC4;
    ssl_prefer_server_ciphers on;
    ssl_session_timeout 5m;

    client_max_body_size 1m;
    root /var/www/html;
    index index.html;

    add_header Strict-Transport-Security "max-age=31536000" always;

    location /civil6/ {
        alias /var/www/html/civil6/;
        try_files $uri $uri/ =404;
    }

    location /civ6-api/ {
        proxy_pass http://127.0.0.1:8080/;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Connection "";
        proxy_read_timeout 30s;
        proxy_connect_timeout 3s;
    }

    location / {
        proxy_pass http://127.0.0.1:8081;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Connection "";
        proxy_read_timeout 600s;
        proxy_connect_timeout 10s;
    }
}
